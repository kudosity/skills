name: Publish skills to ClawHub

# Publishes every folder under skills/ to ClawHub, the official OpenClaw
# skill and plugin registry (https://clawhub.ai).
#
# SAFE BY DEFAULT: manual trigger only, and dry_run defaults to true.
# Nothing publishes until someone runs this deliberately with dry_run unchecked.
#
# Before the first real run:
#   1. Claim the `kudosity` owner namespace on ClawHub (see CONTRIBUTING notes
#      or the org/namespace claim issue on openclaw/clawhub).
#   2. Either add a CLAWHUB_TOKEN repo secret, or configure trusted publishing
#      so this workflow authenticates over GitHub OIDC with no stored secret.
#      `clawhub_token` is optional upstream, and the reusable workflow requires
#      OIDC regardless — so trusted publishing is likely the better route.
#   3. Run once with dry_run: true and read the output before going live.
#
# To publish automatically on each GitHub release, uncomment the `release`
# trigger below — but only after a manual run has succeeded.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only — no publish. Leave checked until a dry run looks right."
        type: boolean
        default: true
      skill_path:
        description: "Optional: publish a single skill folder, e.g. skills/kudosity-sms. Leave blank for all."
        type: string
        required: false

  # release:
  #   types: [published]

permissions:
  contents: read
  id-token: write   # required — the reusable workflow authenticates over OIDC

jobs:
  publish:
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@main
    with:
      owner: kudosity
      root: skills
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      skill_path: ${{ inputs.skill_path || '' }}
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
